# fly.toml app configuration file generated for paradigm-shift-classifier-frontend
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "paradigm-shift-classifier-frontend"
primary_region = "sjc"

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "5s"
  method = "GET"
  path = "/"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[env]
  VITE_API_URL = "https://app-fpxysssf.fly.dev"
